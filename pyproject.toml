[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "founder-vn"
dynamic = ["version"]
description = "Founder skills for Vietnam: CLI and MCP server over one package."
requires-python = ">=3.11"
dependencies = ["mcp", "httpx"]

[project.scripts]
founder-vn = "founder_vn.cli:main"
founder-vn-mcp = "founder_vn.server:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.hatch.version]
path = "src/founder_vn/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/founder_vn"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
